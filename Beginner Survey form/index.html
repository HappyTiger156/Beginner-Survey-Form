 <!DOCTYPE html>
<html>
<head>
    <title>Beginner Survey Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-box">
        <h1>Beginner Survey Form</h1>

        <fieldset>
            <legend>Personal Details</legend>

            <label>Name:</label>
            <input type="text" placeholder="Enter your name"><br>

            <label>Address:</label>
            <input type="text" placeholder="Enter your Address"><br>

            <label>Email:</label>
            <input type="email" placeholder="Enter your Email"><br>

            <label>Number:</label>
            <input type="text" placeholder="Enter your Number"><br>

            <p>Please select your gender:</p>

            <input type="radio" name="gender"> Male <br>
            <input type="radio" name="gender" checked> Female <br>
            <input type="radio" name="gender"> Non-binary <br>
            <input type="radio" name="gender"> Prefer not to say <br>
        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>

            <p>Enter Your Background Information</p>

            <textarea placeholder="Enter Your Background Information"></textarea>
        </fieldset>

        <div class="btn-box">
            <button>submit</button>
        </div>
    </div>

</body>
</html>
